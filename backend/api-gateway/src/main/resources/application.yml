server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: loan-application-service
          uri: lb://loan-application-service
          predicates:
            - Path=/api/loan-applications/**
          filters:
            - StripPrefix=1
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/api/clients/**
          filters:
            - StripPrefix=1
        - id: collateral-service
          uri: lb://collateral-service
          predicates:
            - Path=/api/collateral/**
          filters:
            - StripPrefix=1
        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/api/documents/**
          filters:
            - StripPrefix=1
        - id: workflow-service
          uri: lb://workflow-service
          predicates:
            - Path=/api/workflows/**
          filters:
            - StripPrefix=1
        - id: swagger-ui
          uri: lb://loan-application-service
          predicates:
            - Path=/api/loan-applications/swagger-ui.html
          filters:
            - StripPrefix=1
        - id: swagger-ui-client
          uri: lb://client-service
          predicates:
            - Path=/api/clients/swagger-ui.html
          filters:
            - StripPrefix=1
        - id: swagger-ui-collateral
          uri: lb://collateral-service
          predicates:
            - Path=/api/collateral/swagger-ui.html
          filters:
            - StripPrefix=1
        - id: swagger-ui-document
          uri: lb://document-service
          predicates:
            - Path=/api/documents/swagger-ui.html
          filters:
            - StripPrefix=1
        - id: swagger-ui-workflow
          uri: lb://workflow-service
          predicates:
            - Path=/api/workflows/swagger-ui.html
          filters:
            - StripPrefix=1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/auth/realms/avalon

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    com.gspb.avalon.gateway: DEBUG
