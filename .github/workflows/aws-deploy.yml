name: AWS Deployment

on:
  push:
    branches: [ master, master-branch ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
    
    - name: Build and push service registry
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: avalon-service-registry
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend/service-registry
        mvn clean package -DskipTests
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Build and push API gateway
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: avalon-api-gateway
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend/api-gateway
        mvn clean package -DskipTests
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Build and push client service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: avalon-client-service
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend/client-service
        mvn clean package -DskipTests
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Build and push loan application service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: avalon-loan-application-service
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend/loan-application-service
        mvn clean package -DskipTests
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Build and push document service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: avalon-document-service
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend/document-service
        mvn clean package -DskipTests
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Build and push workflow service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: avalon-workflow-service
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend/workflow-service
        mvn clean package -DskipTests
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Update ECS services
      run: |
        aws ecs update-service --cluster avalon-cluster --service avalon-service-registry --force-new-deployment
        aws ecs update-service --cluster avalon-cluster --service avalon-api-gateway --force-new-deployment
        aws ecs update-service --cluster avalon-cluster --service avalon-client-service --force-new-deployment
        aws ecs update-service --cluster avalon-cluster --service avalon-loan-application-service --force-new-deployment
        aws ecs update-service --cluster avalon-cluster --service avalon-document-service --force-new-deployment
        aws ecs update-service --cluster avalon-cluster --service avalon-workflow-service --force-new-deployment

  build-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: cd backend && mvn -B package --file pom.xml
    
    - name: Run tests
      run: cd backend && mvn test

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Install shared components dependencies
      run: cd frontend/shared-components && npm install
    
    - name: Build shared components
      run: cd frontend/shared-components && npm run build
    
    - name: Install advisor portal dependencies
      run: cd frontend/advisor-portal && npm install
    
    - name: Build advisor portal with production API URL
      run: |
        cd frontend/advisor-portal
        REACT_APP_API_URL=https://api.avalon.example.com npm run build
    
    - name: Deploy to S3
      run: |
        aws s3 sync frontend/advisor-portal/build/ s3://avalon-frontend-prod/ --delete
    
    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install shared components dependencies
      run: cd frontend/shared-components && npm install
    
    - name: Build shared components
      run: cd frontend/shared-components && npm run build
    
    - name: Install advisor portal dependencies
      run: cd frontend/advisor-portal && npm install
    
    - name: Run linting
      run: cd frontend/advisor-portal && npm run lint
    
    - name: Run tests
      run: cd frontend/advisor-portal && npm test
    
    - name: Build advisor portal
      run: cd frontend/advisor-portal && npm run build
